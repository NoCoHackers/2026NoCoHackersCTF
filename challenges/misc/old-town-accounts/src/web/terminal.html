<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Old Town Accounts — Night Terminal</title>
<link rel="stylesheet" href="/xterm.css">
<style>
  * { box-sizing: border-box; }
  body { min-height: 100vh; background: #0e0d0b; color: #d8cfae; margin: 0;
         padding: clamp(.5rem, 2vw, 1.5rem); display: grid; place-items: center;
         font-family: ui-monospace, Menlo, Consolas, monospace; }
  #station { width: min(96vw, 1120px); height: min(94vh, 760px);
             display: flex; flex-direction: column; overflow: hidden;
             background: #14120f; border: 1px solid #4a3e29;
             box-shadow: 0 1.25rem 4rem #000a, inset 0 0 2.5rem #0005; }
  #bar { display: flex; flex-wrap: wrap; gap: .55em 1em; align-items: center;
         padding: .65em 1em; background: #201c14;
         border-bottom: 1px solid #3a3120; }
  #bar b { letter-spacing: .08em; }
  #status { margin-left: auto; font-size: .85em; opacity: .8; }
  #term { flex: 1; min-height: 0; padding: clamp(.75rem, 2vw, 1.5rem);
          display: grid; place-items: center; overflow: auto; }
  #term .xterm-viewport { scrollbar-width: thin;
                          scrollbar-color: #57492b #14120f; }
  #term .xterm-viewport::-webkit-scrollbar { width: 8px; }
  #term .xterm-viewport::-webkit-scrollbar-track { background: #14120f; }
  #term .xterm-viewport::-webkit-scrollbar-thumb { background: #57492b; }
  #reset { background: #3a3120; color: #d8cfae; border: 1px solid #57492b;
           padding: .3em .8em; cursor: pointer; }
  #notice { margin: .7em 1em 0; padding: .4em .8em; background: #33240f;
            border: 1px solid #6b4a17; font-size: .9em; display: none; }
  #notice.visible { display: block; }
  @media (max-width: 700px) {
    body { padding: 0; place-items: stretch; }
    #station { width: 100vw; height: 100vh; border: 0; }
    #status { width: 100%; margin-left: 0; }
    #term { place-items: start; }
  }
</style>
</head>
<body>
<main id="station">
  <div id="bar">
    <b>OLD TOWN ACCOUNTS</b>
    <span style="opacity:.6">night clerk station</span>
    <span style="opacity:.5" title="UNIX V4 uses # as its erase character">Backspace echoes #</span>
    <button id="reset" title="Wipes this machine and boots a fresh copy. Progress is lost.">Reset machine</button>
    <span id="status">connecting…</span>
  </div>
  <!--NOTICE-->
  <div id="term"></div>
</main>
<script src="/xterm.js"></script>
<script>
const term = new Terminal({ cols: 80, rows: 24, cursorBlink: true,
                            convertEol: false, fontSize: 18, lineHeight: 1.15,
                            theme: { background: "#14120f", foreground: "#d8cfae" } });
term.open(document.getElementById("term"));
const status = document.getElementById("status");
let ws;

function connect() {
  status.textContent = "connecting…";
  // Cookie auth: ota_sess is HttpOnly, sent automatically with the handshake.
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { status.textContent = "connected"; };
  ws.onmessage = (e) => term.write(new Uint8Array(e.data));
  ws.onclose = () => { status.textContent = "disconnected — retrying in 2s";
                       setTimeout(connect, 2000); };
}

term.onData((data) => { if (ws && ws.readyState === 1) ws.send(data); });

document.getElementById("reset").onclick = async () => {
  if (!confirm("Reset wipes this machine and boots a fresh copy. Continue?"))
    return;
  if (ws) {
    ws.onclose = null;
    ws.close();
  }
  const response = await fetch("/reset", { method: "POST" });
  if (!response.ok) {
    status.textContent = response.status === 429
      ? "reset is cooling down — try again shortly"
      : "reset failed — reconnecting";
  } else {
    status.textContent = "rebooting…";
  }
  setTimeout(connect, 2500);
};

term.focus();
connect();
</script>
</body>
</html>
