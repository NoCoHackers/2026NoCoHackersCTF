name: "PDP-11 After Dark I: The Night Clerk"
author: bjames
category: misc

description: >-
  While walking your dog through Lions Park after dark, a cloaked figure
  presses a battered cartridge into your hands. Its yellowed label reads
  **OLD TOWN ACCOUNTS NIGHT SHIFT COPY**. It is a bootable
  RK05 image from a PDP-11 running UNIX V4.

  Recover the night clerk's credential from the cartridge, then sign in to
  the accounting system.

  Connect: https://old-town-accounts.chal.nocohackers.com

value: 400
type: standard

flags:
  - noco{87456be352ad1dde153afb588a3f1b19}

tags: [hard, retrocomputing]
hints: []

files:
  - handout/old-town-accounts.rk
  - handout/README.txt
  - handout/CALDERA-LICENSE.txt

state: visible
version: "0.1"

x-noco:
  kind: web
  subdomain: old-town-accounts
  port: null
  memory: 512m
  cpus: "2.0"
  pids: 128
  autosolve: solution/solve.sh
  healthcheck_path: /healthz
