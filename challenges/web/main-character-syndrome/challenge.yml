name: Main Character Syndrome
author: bjames
category: web
description: |
  Old Town's night-watch registry has a container image waiting for promotion.
  Its CI record says it came from a feature branch, and the deploy gate only
  accepts passing builds from main. You can edit the registry listing's
  description, but not the CI record. Get the image promoted.

  Connect: https://registry.chal.nocohackers.com
value: 100
type: dynamic
extra:
  initial: 400
  decay: 25
  minimum: 100
flags:
  - noco{a_description_is_not_provenance}
tags: [web, injection]
hints:
  - content: The verifier reads JSON lines. Which of its inputs should be trusted?
    cost: 50
files: []
state: hidden
version: "1.0"
x-noco:
  kind: web
  subdomain: registry
  port: null
  memory: 128m
  cpus: "0.5"
  pids: 64
  autosolve: solution/solve.sh
  healthcheck_path: /healthz
