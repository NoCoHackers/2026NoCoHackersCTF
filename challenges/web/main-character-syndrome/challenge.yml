name: Main Character Syndrome
author: bjames
category: web
description: |
  Old Town's cache-de-spectre executable is waiting for promotion. Its CI
  record says feature branch; the release gate demands a passing main build.
  Upload a binary with registry metadata and get the release job to run it.

  Connect: https://registry.chal.nocohackers.com
value: 100
type: dynamic
extra:
  initial: 400
  decay: 25
  minimum: 100
flags:
  - noco{a_description_is_not_provenance}
tags: [web, injection]
hints:
  - content: Compare the verifier's record count for ordinary and unusual descriptions.
    cost: 50
files: [handout/cache-de-spectre]
state: hidden
version: "1.0"
x-noco:
  kind: web
  subdomain: registry
  port: null
  memory: 256m
  cpus: "0.5"
  pids: 64
  autosolve: solution/solve.sh
  healthcheck_path: /healthz
