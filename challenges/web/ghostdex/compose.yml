# Local development only. The real deployment file is generated from every
# challenge.yml by `deploy/chals/generate.py` - do not hand-edit that one.
#
#   FLAG='noco{local_test}' docker compose -f challenges/web/ghostdex/compose.yml up --build
#
services:
  chal:
    build:
      context: ../..              # repo root
      dockerfile: challenges/web/ghostdex/Dockerfile
    environment:
      FLAG: "${FLAG:?set FLAG in your environment}"
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - "/srv/www:uid=101,gid=101,mode=0755"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
