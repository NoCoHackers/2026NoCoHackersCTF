services:
  chal:
    build:
      context: ../../..
      dockerfile: challenges/web/haunted-brewery/Dockerfile
    environment:
      FLAG: "${FLAG:?set FLAG in your environment}"
    ports: ["8080:8080"]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - "/srv/www:uid=101,gid=101,mode=0755"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
