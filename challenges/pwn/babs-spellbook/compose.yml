services:
  chal:
    build:
      context: ../../..
      dockerfile: challenges/pwn/babs-spellbook/Dockerfile
    environment:
      FLAG: "${FLAG:?set FLAG in your environment}"
      NOCO_FLAG_MISFILED_SPELLBOOK: "${NOCO_FLAG_MISFILED_SPELLBOOK:?set NOCO_FLAG_MISFILED_SPELLBOOK}"
      NOCO_FLAG_NAMES_HAVE_POWER: "${NOCO_FLAG_NAMES_HAVE_POWER:?set NOCO_FLAG_NAMES_HAVE_POWER}"
      NOCO_FLAG_SILENT_ORACLE: "${NOCO_FLAG_SILENT_ORACLE:?set NOCO_FLAG_SILENT_ORACLE}"
      NOCO_FLAG_REMEMBERING_CAULDRON: "${NOCO_FLAG_REMEMBERING_CAULDRON:?set NOCO_FLAG_REMEMBERING_CAULDRON}"
    ports: ["30002:1337"]
    read_only: true
    tmpfs: [/tmp, "/flag:size=1m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, SETPCAP]
