services:
  chal:
    build:
      context: ../../..
      dockerfile: challenges/pwn/sams-burrow-guide/Dockerfile
    environment:
      FLAG: "${FLAG:?set FLAG in your environment}"
      NOCO_FLAG_SECRET_TUNNEL: "${NOCO_FLAG_SECRET_TUNNEL:?set NOCO_FLAG_SECRET_TUNNEL}"
      NOCO_FLAG_RETURN_TO_HUTCH: "${NOCO_FLAG_RETURN_TO_HUTCH:?set NOCO_FLAG_RETURN_TO_HUTCH}"
      NOCO_FLAG_PAINTED_SIGN: "${NOCO_FLAG_PAINTED_SIGN:?set NOCO_FLAG_PAINTED_SIGN}"
    ports: ["30004:1337"]
    read_only: true
    tmpfs: [/tmp, "/flag:size=1m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, SETPCAP]
