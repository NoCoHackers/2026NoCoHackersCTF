name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Let production runs reach their firewall cleanup step. Superseded PR runs
  # are safe to cancel because they never receive production credentials.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------- lint
  validate:
    name: validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - name: validate every challenge bundle
        run: tools/validate.py
      - name: challenge tooling unit tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: names.lock is current (rename guard)
        run: tools/lock-names.py --check
      - name: domains.env is current
        run: tools/domains.py --check
      - name: generated compose is current
        run: deploy/chals/generate.py --check
      - name: theme bundle is current
        run: |
          sh tools/build-theme.sh
          git diff --exit-code theme/theme.bundle.css \
            || { echo "::error::theme.bundle.css is stale - run tools/build-theme.sh"; exit 1; }

  # ------------------------------------------------- which challenges changed
  changed:
    name: detect changed challenges
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.detect.outputs.dirs }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: detect
        run: |
          set -euo pipefail
          BASE=${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          # A change to the theme or a base image can break every challenge,
          # so those rebuild everything.
          if git diff --name-only "$BASE" HEAD | grep -qE '^(theme/|images/|tools/)'; then
            echo "shared code changed - testing all challenges"
            DIRS=$(find challenges -name challenge.yml -not -path '*/TEMPLATE/*' \
                   -printf '%h\n' | sort -u)
          else
            DIRS=$(git diff --name-only "$BASE" HEAD \
                   | grep -oE '^challenges/[^/]+/[^/]+' | sort -u \
                   | grep -v TEMPLATE || true)
          fi
          if [ -z "$DIRS" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "dirs=[]"   >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "dirs=$(echo "$DIRS" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi
          echo "$DIRS"

  # ------------------------------------------------------ build + autosolve
  autosolve:
    name: "solve: ${{ matrix.dir }}"
    needs: [validate, changed]
    if: needs.changed.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.changed.outputs.dirs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - name: build base images
        run: tools/build-base-images.sh
      - name: build, boot, solve
        run: tools/test-challenge.sh "${{ matrix.dir }}"

  # --------------------------------------------- whole-stack smoke test
  dev-stack:
    name: dev stack comes up and routes
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - name: bring up the entire environment
        run: make dev
      - name: smoke-test routing (CTFd + web + tcp through the proxy)
        run: tools/dev-smoke.sh
      - name: dump logs on failure
        if: failure()
        run: |
          docker compose -p noco-dev \
            -f deploy/dev/compose.infra.yml \
            -f deploy/dev/docker-compose.dev.yml ps || true
          docker compose -p noco-dev \
            -f deploy/dev/compose.infra.yml \
            -f deploy/dev/docker-compose.dev.yml logs --tail=60 || true
      - name: tear down
        if: always()
        run: make dev-down CLEAN=1 || true

  # ------------------------------------------------------------- publish
  publish:
    name: push images
    needs: [validate, changed, autosolve, dev-stack]
    # A docs/config-only push skips the autosolve matrix. `always()` lets image
    # publication (and therefore CTFd sync) continue only when every job that
    # actually ran succeeded.
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.validate.result == 'success' &&
      needs.changed.result == 'success' &&
      needs.dev-stack.result == 'success' &&
      (needs.autosolve.result == 'success' || needs.autosolve.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push base images
        run: |
          tools/build-base-images.sh
          for i in chal-theme chal-web chal-pwn caddy-ratelimit; do
            docker push "ghcr.io/nocohackers/$i:2026"
          done
      - name: build and push challenge images
        run: |
          set -euo pipefail
          find challenges -name challenge.yml -not -path '*/TEMPLATE/*' -printf '%h\n' \
          | sort -u | while read -r d; do
              eval "$(python3 tools/chalmeta.py "$d")"
              [ "$CHAL_KIND" = "static" ] && continue
              name="$(basename "$(dirname "$d")")-$(basename "$d")"
              img="ghcr.io/nocohackers/chal-$name:2026"
              echo "==> $img"
              docker build -q -f "$d/Dockerfile" -t "$img" .
              docker push "$img"
            done

  # ------------------------------------------------ deploy challenge host
  deploy-chals:
    name: deploy challenge containers
    needs: [publish]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: install flag-generation dependency
        run: pip install PyYAML
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: install deployment SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.CHALLENGE_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.CHALLENGE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          chmod 644 ~/.ssh/known_hosts
      - name: identify runner address
        id: runner
        run: |
          set -euo pipefail
          ip=$(curl -4fsS --retry 3 https://api.ipify.org)
          python3 - "$ip" <<'PY'
          import ipaddress, sys
          ipaddress.IPv4Address(sys.argv[1])
          PY
          echo "cidr=$ip/32" >> "$GITHUB_OUTPUT"
      - name: temporarily allow runner SSH
        env:
          FIREWALL_ID: ${{ vars.CHALLENGE_FIREWALL_ID }}
          RUNNER_CIDR: ${{ steps.runner.outputs.cidr }}
        run: |
          set -euo pipefail
          test -n "$FIREWALL_ID"
          doctl compute firewall add-rules "$FIREWALL_ID" \
            --inbound-rules "protocol:tcp,ports:22,address:$RUNNER_CIDR"
      - name: wait for SSH policy propagation
        env:
          CHALLENGE_HOST: ${{ vars.CHALLENGE_HOST }}
        run: |
          set -euo pipefail
          test -n "$CHALLENGE_HOST"
          for attempt in $(seq 1 18); do
            if ssh -o BatchMode=yes -o ConnectTimeout=5 "noco@$CHALLENGE_HOST" true; then
              exit 0
            fi
            echo "SSH policy not active yet ($attempt/18)"
            sleep 5
          done
          echo "FATAL: SSH did not become reachable after opening the runner /32" >&2
          exit 1
      - name: deploy current challenge images and compose
        env:
          CHALLENGE_HOST: ${{ vars.CHALLENGE_HOST }}
        run: make host-up ROLE=chals HOST="noco@$CHALLENGE_HOST"
      - name: verify public challenge edge
        run: |
          set -euo pipefail
          . deploy/domains.env
          curl -fsS --retry 6 --retry-all-errors --retry-delay 5 \
            "https://$NOCO_PIN_HOST/" >/dev/null
      - name: remove runner SSH rule
        if: always() && steps.runner.outputs.cidr != ''
        env:
          FIREWALL_ID: ${{ vars.CHALLENGE_FIREWALL_ID }}
          RUNNER_CIDR: ${{ steps.runner.outputs.cidr }}
        run: |
          doctl compute firewall remove-rules "$FIREWALL_ID" \
            --inbound-rules "protocol:tcp,ports:22,address:$RUNNER_CIDR" || true

  # ----------------------------------------------------------- sync CTFd
  sync:
    name: sync CTFd
    needs: [deploy-chals]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: install pinned CTFd sync tools
        run: pip install -r deploy/scoreboard/requirements-sync.txt
      - name: push challenges and event config
        env:
          CTFCLI_ACCESS_TOKEN: ${{ secrets.CTFCLI_ACCESS_TOKEN }}
        run: make sync
