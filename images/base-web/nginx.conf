server {
    listen 8080;
    server_name _;

    root /srv/www;
    index index.html;
    charset utf-8;

    # SSI powers <!--#include file="header.html" --> in the partials.
    ssi on;

    # Theme is served from a fixed path on every challenge so that a player
    # (or an organizer debugging at 2am) always finds it in the same place.
    location /theme/ {
        alias /srv/theme/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # No CDNs: the challenge host egress-filters outbound traffic, so a page
    # that depends on one will simply hang. Keep everything local.
    add_header Content-Security-Policy
        "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }
}
